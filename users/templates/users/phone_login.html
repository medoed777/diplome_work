<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сервис авторизации по номеру телефона</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
{% include 'includes/inc_menu.html' %}
<div class="container">
    {% block content %}
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header border-0">
                            <h3 class="text-center mb-0">Вход по номеру телефона</h3>
                        </div>
                        <div class="card-body p-4">
                           <form method="post" id="phoneForm">
                               {% csrf_token %}
                               <div class="mb-3">
                                   <label for="phone" class="form-label">Номер телефона</label>
                                   <input type="tel" class="form-control" id="phone" name="phone" required placeholder="+7 (___)-___-__-__">
                                   {% if form.phone.errors %}
                                       <div class="alert alert-danger mt-2">
                                           {{ form.phone.errors|join:', ' }}
                                       </div>
                                   {% endif %}
                               </div>
                               <div class="d-grid">
                                   <button type="submit" class="btn btn-primary btn-lg">Получить код</button>
                               </div>
                           </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    {% endblock %}

    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        {% include 'includes/inc_footer.html' %}
    </footer>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
