version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: referral_system
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - static_volume:/app/static/
    depends_on:
      - db
      - redis

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static/
    depends_on:
      - web

  db:
    image: postgres:16.3
    container_name: postgres_diplome
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db
      REDIS_HOST: redis
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-diplome
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis


volumes:
  postgres_data:
  static_volume: